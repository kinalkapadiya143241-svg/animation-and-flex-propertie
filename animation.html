<!DOCTYPE html>
<html>
<head>
<title>Bouncing Loader</title>
<style>
body {
margin: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background-color: #f2f2f2;
}
.loader {
display: flex;
gap: 20px;
}
.dot {
width: 30px;
height: 30px;
background-color: palevioletred;
border-radius: 100%;
animation: bounce 0.8s infinite alternate;
}
.dot:nth-child(2) {
animation-delay: 0.2s;
}
.dot:nth-child(3) {
animation-delay: 0.4s;
}
@keyframes bounce {
from {
transform: translatey(0);
}
to {
transform: translatey(-30px);
}
}
</style>
</head>
<body>
<div class="loader">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</body>
</html>
